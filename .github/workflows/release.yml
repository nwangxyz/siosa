# 태그(v1.0.0 등)를 푸시하면 Windows 서버에서 빌드해 GitHub 릴리스를 만들고 Siosa-v<버전>.zip 을 첨부한다.
#   1) Overlay/AppInfo.cs 의 Version 을 올리고, docs/CHANGELOG.md 맨 위에 '## v<버전>' 변경 사항을 적어 커밋·푸시
#   2) git tag v<버전>  →  git push origin v<버전>
# 릴리스 본문은 사용자용 안내: 이번 버전 변경 사항(CHANGELOG) + 받기·설치·SmartScreen·업데이트·문의(docs/release-notes.md)
# 태그와 AppInfo.cs 버전이 다르거나 CHANGELOG 에 그 버전이 없으면 release.ps1 이 실패시킨다.
# 같은 태그의 릴리스가 이미 있으면 본문과 zip 을 바꾼다.
# 앱의 자동 업데이트는 최신 릴리스의 태그와 첨부 zip 을 본다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 릴리스 만들기·파일 첨부

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build portable zip and release notes
        shell: pwsh
        run: ./release.ps1 -Tag "$env:TAG"

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/Siosa-$env:TAG.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --title "Siosa $env:TAG" --notes-file dist/release-notes.md
            gh release upload $env:TAG $zip --clobber
          } else {
            gh release create $env:TAG $zip --title "Siosa $env:TAG" --notes-file dist/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
